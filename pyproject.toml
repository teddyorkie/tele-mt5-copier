[project]
name = "tele-mt5-copier"
version = "0.1.0"
description = "Telegram / GUI Signal to MetaTrader 5 Limit Order Copier & Auto Trade Manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "MetaTrader5>=5.0.45",
    "PyYAML>=6.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
managed = true
link-mode = "copy"
